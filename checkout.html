<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finalizează comanda - MORFI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Poppins', sans-serif; }
  .grad-brand { background: linear-gradient(135deg, #8b5cf6 0%, #7c3fbf 45%, #5b2f8f 100%); }
</style>
</head>
<body class="bg-white text-slate-900">

<header class="border-b border-slate-100">
  <div class="max-w-[900px] mx-auto flex items-center px-4 sm:px-6 py-4">
    <a href="index.html" class="flex items-center">
      <img src="img/logo-trimmed.png" alt="MORFI" class="h-12 w-auto">
    </a>
  </div>
</header>

<main class="max-w-[900px] mx-auto px-4 sm:px-6 py-8 sm:py-12 grid md:grid-cols-[1.3fr_1fr] gap-10">
  <section>
    <h1 class="text-2xl font-extrabold text-[#241533] mb-6">Finalizează comanda</h1>

    <div id="checkout-empty" class="hidden text-slate-500">
      Coșul tău e gol. <a href="index.html" class="text-[#6b3fa0] font-semibold">Înapoi la magazin</a>.
    </div>

    <form id="checkout-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="customer-name">Nume complet</label>
        <input id="customer-name" name="customerName" type="text" required
          class="w-full rounded-lg border border-slate-200 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#6b3fa0]/30">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="customer-phone">Telefon</label>
        <input id="customer-phone" name="customerPhone" type="tel" required
          class="w-full rounded-lg border border-slate-200 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#6b3fa0]/30">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="delivery-method">Metodă de livrare</label>
        <select id="delivery-method" name="deliveryMethod" required
          class="w-full rounded-lg border border-slate-200 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#6b3fa0]/30">
          <option value="curier">Livrare prin curier</option>
          <option value="ridicare_personala">Ridicare personală</option>
        </select>
      </div>

      <div id="delivery-address-field">
        <label class="block text-sm font-medium text-slate-700 mb-1" for="delivery-address">Adresă de livrare</label>
        <input id="delivery-address" name="deliveryAddress" type="text"
          class="w-full rounded-lg border border-slate-200 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#6b3fa0]/30">
      </div>

      <p id="checkout-error" class="hidden text-sm text-red-600"></p>

      <button id="checkout-submit" type="submit"
        class="w-full grad-brand text-white font-semibold px-6 py-3.5 rounded-xl shadow-lg shadow-purple-300/50 hover:shadow-xl transition-shadow disabled:opacity-50">
        Plasează comanda
      </button>
    </form>
  </section>

  <aside class="bg-slate-50 rounded-2xl p-5 h-fit">
    <h2 class="font-bold text-slate-800 mb-4">Sumarul comenzii</h2>
    <div id="order-summary-items" class="space-y-3 mb-4"></div>
    <div class="flex items-center justify-between font-bold text-slate-800 pt-3 border-t border-slate-200">
      <span>Subtotal</span>
      <span id="order-summary-subtotal">0,00 lei</span>
    </div>
  </aside>
</main>

<script type="module" src="js/checkout.js"></script>
</body>
</html>
